- type: entity
  name: plasma
  id: BulletFlame
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Guns/Ammunition/Projectiles/flamer.rsi
    scale: 0.7, 0.7
    layers:
    - state: flamershot
      shader: unshaded
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.8,-0.8,0.8,0.8"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: Ammo
    muzzleFlash: FlamerMuzzleFlashEffect
  - type: Projectile
    impactEffect: BulletFlamerImpactEffect
    damage:
      types:
        Heat: 25
    soundHit:
      path: "/Audio/Weapons/Guns/Hits/energy_meat1.ogg"

- type: entity
  id: FlamerMuzzleFlashEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.5
  - type: Sprite
    drawdepth: Effects
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: _ReclamationProject/Objects/Weapons/Guns/Ammunition/Projectiles/flamer.rsi
      state: muzzle_flamer
  - type: EffectVisuals
  - type: Tag
    tags:
      - HideContextMenu
  - type: AnimationPlayer

- type: entity
  id: BulletFlamerImpactEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.25
  - type: Sprite
    drawdepth: Effects
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: _ReclamationProject/Objects/Weapons/Guns/Ammunition/Projectiles/flamer.rsi
      state: impact_flamer
  - type: EffectVisuals
  - type: Tag
    tags:
      - HideContextMenu

