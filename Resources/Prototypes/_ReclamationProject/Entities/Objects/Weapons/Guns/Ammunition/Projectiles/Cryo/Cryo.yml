- type: entity
  name: cryo flame
  id: BulletCryolator
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _ReclamationProject/Objects/Weapons/Guns/Ammunition/Projectiles/cryolator.rsi
    scale: 0.7, 0.7
    layers:
    - state: cryoflame
      shader: unshaded
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.8,-0.8,0.8,0.8"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: Ammo
    muzzleFlash: CryolatorMuzzleFlashEffect
  - type: Projectile
    impactEffect: BulletCryoImpactEffect
    damage:
      types:
        Cold: 25
    soundHit:
      path: "/Audio/Weapons/Guns/Hits/energy_meat1.ogg"

- type: entity
  id: CryolatorMuzzleFlashEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.5
  - type: Sprite
    drawdepth: Effects
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: _ReclamationProject/Objects/Weapons/Guns/Ammunition/Projectiles/cryolator.rsi
      state: muzzle_cryolator
  - type: EffectVisuals
  - type: Tag
    tags:
      - HideContextMenu
  - type: AnimationPlayer

- type: entity
  id: BulletCryoImpactEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.25
  - type: Sprite
    drawdepth: Effects
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: _ReclamationProject/Objects/Weapons/Guns/Ammunition/Projectiles/cryolator.rsi
      state: impact_cryolator
  - type: EffectVisuals
  - type: Tag
    tags:
      - HideContextMenu
